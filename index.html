<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>yrenk — artist / designer</title>
    <style>
        :root {
            --primary-deepest: #000a1f;
            --primary-deeper: #00145c;
            --primary-dark: #001b75;
            --primary-mid-dark: #012696;
            --primary-mid: #012eb0;
            --primary-soft: #1a3fbf;
            --primary-light: #3355cc;
            --primary-lighter: #4d6dd9;
            --primary-pale: #6684e6;
            --accent-pale: #A4E2C6;
            --accent-wash: #bdf0d8;
            --text-all: #F4EAC5;
            --blur-strong: 56px;
            --spacing-xs: 8px;
            --spacing-sm: 16px;
            --spacing-md: 28px;
            --spacing-lg: 48px;
            --spacing-xl: 80px;
            --spacing-2xl: 120px;
            --card-radius: 20px;
            --card-padding: 52px 48px;
            --transition-ease: cubic-bezier(0.25, 0.1, 0.25, 1);
            --transition-spring: cubic-bezier(0.34, 1.56, 0.64, 1);
            --transition-smooth: cubic-bezier(0.4, 0, 0.2, 1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
            scrollbar-width: thin;
            scrollbar-color: var(--primary-lighter) transparent;
            cursor: none;
        }
        ::-webkit-scrollbar {
            width: 4px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: var(--primary-lighter);
            border-radius: 2px;
        }

        body {
            font-family: 'Inter', 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', system-ui, -apple-system, sans-serif;
            background-color: var(--primary-deeper);
            color: var(--text-all);
            line-height: 1.75;
            letter-spacing: 0.01em;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            overflow-x: hidden;
            min-height: 100vh;
            position: relative;
            cursor: none;
            font-weight: 400;
        }

        /* ============ 自定义光标 ============ */
        .custom-cursor {
            position: fixed;
            top: 0;
            left: 0;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: var(--accent-pale);
            pointer-events: none;
            z-index: 99999;
            transform: translate(-50%, -50%);
            transition: width 0.28s var(--transition-smooth),
                height 0.28s var(--transition-smooth),
                background 0.32s var(--transition-smooth),
                box-shadow 0.32s var(--transition-smooth);
            box-shadow: 0 0 0 0 rgba(164, 226, 198, 0);
            will-change: transform, left, top;
        }
        .custom-cursor--inverted {
            background: var(--primary-mid-dark);
            box-shadow: 0 0 20px 3px rgba(1, 38, 150, 0.5);
        }
        .custom-cursor--hover {
            width: 22px;
            height: 22px;
            box-shadow: 0 0 24px 6px rgba(164, 226, 198, 0.55);
        }
        .custom-cursor--hover.custom-cursor--inverted {
            box-shadow: 0 0 24px 6px rgba(1, 38, 150, 0.55);
        }

        @media (hover: none) and (pointer: coarse) {
            .custom-cursor {
                display: none;
            }
            html,
            body {
                cursor: auto;
            }
        }

        /* ============ 加载页面 ============ */
        .loading-screen {
            position: fixed;
            inset: 0;
            z-index: 9998;
            background-color: var(--primary-deeper);
            display: flex;
            align-items: flex-start;
            justify-content: center;
            transition: opacity 0.55s var(--transition-smooth);
            opacity: 1;
            pointer-events: all;
        }
        .loading-screen--fade-out {
            opacity: 0;
            pointer-events: none;
        }
        .loading-screen--hidden {
            display: none;
        }
        .loading-logo {
            position: absolute;
            top: 40px;
            left: 40px;
            font-size: 1.35rem;
            font-weight: 700;
            letter-spacing: 0.05em;
            color: var(--text-all);
            text-decoration: none;
            z-index: 1;
        }
        .loading-indicator {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 200px;
            height: 1.5px;
            background: rgba(244, 234, 197, 0.14);
            border-radius: 1px;
            overflow: hidden;
        }
        .loading-bar {
            height: 100%;
            width: 0%;
            background: var(--accent-pale);
            border-radius: 1px;
            box-shadow: 0 0 12px rgba(164, 226, 198, 0.45);
            animation: loadingProgress 2s var(--transition-smooth) both;
        }
        @keyframes loadingProgress {
            0% {
                width: 0%;
            }
            100% {
                width: 100%;
            }
        }

        /* ============ 动态模糊背景光斑 ============ */
        .bg-orbs {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
        }
        .bg-orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(var(--blur-strong));
            opacity: 0.32;
            will-change: transform;
            animation-timing-function: cubic-bezier(0.45, 0.05, 0.55, 0.95);
            animation-iteration-count: infinite;
        }
        .bg-orb--1 {
            width: 58vmax;
            height: 58vmax;
            background: radial-gradient(circle, rgba(1, 38, 150, 0.45) 0%, rgba(0, 20, 80, 0.18) 50%, transparent 70%);
            top: -22%;
            left: -16%;
            animation-name: orbFloat1;
            animation-duration: 20s;
            animation-delay: 0s;
        }
        .bg-orb--2 {
            width: 50vmax;
            height: 50vmax;
            background: radial-gradient(circle, rgba(1, 38, 150, 0.4) 0%, rgba(0, 15, 60, 0.14) 50%, transparent 70%);
            bottom: -28%;
            right: -14%;
            animation-name: orbFloat2;
            animation-duration: 24s;
            animation-delay: -6s;
        }
        .bg-orb--3 {
            width: 40vmax;
            height: 40vmax;
            background: radial-gradient(circle, rgba(244, 234, 197, 0.14) 0%, rgba(200, 180, 140, 0.06) 50%, transparent 70%);
            top: 48%;
            left: 38%;
            animation-name: orbFloat3;
            animation-duration: 22s;
            animation-delay: -12s;
        }
        .bg-orb--4 {
            width: 32vmax;
            height: 32vmax;
            background: radial-gradient(circle, rgba(1, 38, 150, 0.3) 0%, rgba(0, 18, 70, 0.08) 50%, transparent 70%);
            top: 8%;
            right: 18%;
            animation-name: orbFloat4;
            animation-duration: 18s;
            animation-delay: -4s;
        }

        @keyframes orbFloat1 {
            0%,
            100% {
                transform: translate(0, 0) scale(1);
            }
            20% {
                transform: translate(9vw, 6vh) scale(1.14);
            }
            40% {
                transform: translate(4vw, 13vh) scale(0.89);
            }
            60% {
                transform: translate(-6vw, 8vh) scale(1.07);
            }
            80% {
                transform: translate(3vw, -4vh) scale(0.94);
            }
        }
        @keyframes orbFloat2 {
            0%,
            100% {
                transform: translate(0, 0) scale(1);
            }
            25% {
                transform: translate(-7vw, -9vh) scale(1.12);
            }
            50% {
                transform: translate(-3vw, -4vh) scale(0.87);
            }
            75% {
                transform: translate(6vw, -7vh) scale(1.05);
            }
        }
        @keyframes orbFloat3 {
            0%,
            100% {
                transform: translate(0, 0) scale(1);
            }
            30% {
                transform: translate(6vw, -5vh) scale(1.1);
            }
            60% {
                transform: translate(-4vw, 7vh) scale(0.91);
            }
            85% {
                transform: translate(2vw, -3vh) scale(1.04);
            }
        }
        @keyframes orbFloat4 {
            0%,
            100% {
                transform: translate(0, 0) scale(1);
            }
            35% {
                transform: translate(-5vw, 8vh) scale(1.17);
            }
            65% {
                transform: translate(7vw, 3vh) scale(0.86);
            }
            90% {
                transform: translate(-2vw, -6vh) scale(1.06);
            }
        }

        .bg-texture {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 0;
            opacity: 0.02;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='1'/%3E%3C/svg%3E");
            background-size: 180px 180px;
        }

        /* ============ 主容器 ============ */
        .main-container {
            position: relative;
            z-index: 1;
            max-width: 1080px;
            margin: 0 auto;
            padding: 0 48px;
        }

        /* ============ 导航栏 ============ */
        .nav {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 100;
            padding: 18px 48px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(0, 18, 70, 0.78);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border-bottom: 1px solid rgba(164, 226, 198, 0.08);
            transition: all 0.45s var(--transition-smooth);
        }
        .nav--scrolled {
            background: rgba(0, 8, 36, 0.9);
            border-bottom-color: rgba(164, 226, 198, 0.2);
            box-shadow: 0 2px 40px rgba(0, 0, 0, 0.45);
            padding: 14px 48px;
        }

        .nav__logo {
            font-size: 1.3rem;
            font-weight: 700;
            letter-spacing: 0.06em;
            color: var(--text-all);
            text-decoration: none;
            transition: all 0.3s var(--transition-smooth);
            position: relative;
            white-space: nowrap;
        }
        .nav__logo::after {
            content: '';
            position: absolute;
            bottom: -4px;
            left: 0;
            width: 0;
            height: 1.5px;
            background: var(--text-all);
            transition: width 0.4s var(--transition-smooth);
            border-radius: 1px;
        }
        .nav__logo:hover::after {
            width: 100%;
        }

        .nav__links {
            display: flex;
            align-items: center;
            gap: 32px;
            list-style: none;
            flex-wrap: wrap;
            justify-content: flex-end;
        }
        .nav__link {
            text-decoration: none;
            color: var(--text-all);
            font-size: 0.88rem;
            font-weight: 400;
            letter-spacing: 0.05em;
            transition: all 0.3s var(--transition-smooth);
            position: relative;
            padding: 5px 0;
            cursor: pointer;
            background: none;
            border: none;
            font-family: inherit;
            white-space: nowrap;
        }
        .nav__link::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 0;
            height: 1.5px;
            background: var(--text-all);
            transition: width 0.4s var(--transition-smooth);
            border-radius: 1px;
        }
        .nav__link:hover {
            font-weight: 600;
        }
        .nav__link:hover::after {
            width: 100%;
        }

        .lang-switch {
            display: flex;
            align-items: center;
            gap: 3px;
            background: rgba(1, 38, 150, 0.22);
            border: 1px solid rgba(164, 226, 198, 0.16);
            border-radius: 24px;
            padding: 3px;
            transition: all 0.3s var(--transition-smooth);
            cursor: pointer;
            white-space: nowrap;
        }
        .lang-switch:hover {
            background: rgba(1, 38, 150, 0.4);
            border-color: rgba(164, 226, 198, 0.4);
        }
        .lang-option {
            padding: 6px 15px;
            border-radius: 20px;
            font-size: 0.78rem;
            letter-spacing: 0.05em;
            transition: all 0.3s var(--transition-smooth);
            cursor: pointer;
            border: none;
            background: transparent;
            color: var(--text-all);
            font-family: inherit;
            font-weight: 400;
        }
        .lang-option--active {
            background: var(--accent-pale);
            color: var(--primary-mid-dark);
            font-weight: 700;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.25);
        }

        /* ============ Hero 区域 ============ */
        .hero {
            min-height: 100vh;
            display: flex;
            align-items: center;
            padding: 140px 0 90px;
            position: relative;
        }
        .hero__inner {
            display: flex;
            align-items: center;
            gap: 72px;
            width: 100%;
            animation: heroReveal 1.8s var(--transition-smooth) both;
        }
        @keyframes heroReveal {
            0% {
                filter: blur(16px);
                transform: translateY(28px);
            }
            100% {
                filter: blur(0);
                transform: translateY(0);
            }
        }
        .hero__logo-wrap {
            flex-shrink: 0;
            position: relative;
        }
        .hero__logo-img {
            width: clamp(110px, 16vw, 180px);
            height: auto;
            display: block;
            filter: drop-shadow(0 0 50px rgba(164, 226, 198, 0.12));
            transition: filter 0.6s ease;
        }
        .hero__divider {
            width: 1px;
            height: clamp(60px, 10vh, 100px);
            background: linear-gradient(to bottom, transparent, rgba(244, 234, 197, 0.3), rgba(244, 234, 197, 0.3), transparent);
            flex-shrink: 0;
        }
        .hero__text {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        .hero__tagline {
            font-size: clamp(1.15rem, 2.4vw, 1.5rem);
            font-weight: 300;
            letter-spacing: 0.09em;
            color: var(--text-all);
            line-height: 1.6;
            max-width: 460px;
        }
        .hero__scroll-indicator {
            position: absolute;
            bottom: 48px;
            left: 0;
            display: flex;
            align-items: center;
            gap: 14px;
            cursor: pointer;
            background: none;
            border: none;
            color: var(--text-all);
            font-family: inherit;
            font-size: 0.7rem;
            letter-spacing: 0.12em;
            font-weight: 400;
            transition: all 0.4s var(--transition-smooth);
            animation: indicatorReveal 1.2s 1s var(--transition-smooth) both;
        }
        @keyframes indicatorReveal {
            0% {
                filter: blur(10px);
                transform: translateY(16px);
            }
            100% {
                filter: blur(0);
                transform: translateY(0);
            }
        }
        .hero__scroll-indicator:hover {
            gap: 20px;
            font-weight: 600;
        }
        .scroll-line {
            width: 36px;
            height: 1px;
            background: var(--text-all);
            transition: width 0.4s var(--transition-smooth);
        }
        .hero__scroll-indicator:hover .scroll-line {
            width: 54px;
        }

        /* ============ 通用区域 ============ */
        .section {
            padding: 100px 0;
            position: relative;
        }
        .section__label {
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 0.16em;
            color: var(--text-all);
            margin-bottom: 28px;
            font-weight: 500;
        }

        /* ============ 卡片 ============ */
        .glass-card {
            background: rgba(1, 27, 110, 0.35);
            border: 1px solid rgba(164, 226, 198, 0.08);
            border-radius: var(--card-radius);
            padding: var(--card-padding);
            transition: all 0.5s var(--transition-smooth);
            position: relative;
        }
        .glass-card:hover {
            background: rgba(1, 33, 130, 0.5);
            border-color: rgba(164, 226, 198, 0.25);
            box-shadow: 0 8px 48px rgba(0, 0, 0, 0.4);
            transform: translateY(-2px);
        }

        .glass-card__text {
            font-size: 1.05rem;
            line-height: 2;
            color: var(--text-all);
            letter-spacing: 0.025em;
            font-weight: 400;
        }
        .glass-card__text p {
            margin-bottom: 18px;
        }
        .glass-card__text p:last-child {
            margin-bottom: 0;
        }
        .glass-card__highlight {
            color: var(--text-all);
            font-weight: 700;
            position: relative;
            display: inline-block;
        }
        .glass-card__highlight::after {
            content: '';
            position: absolute;
            bottom: 4px;
            left: 0;
            width: 100%;
            height: 2px;
            background: rgba(244, 234, 197, 0.3);
            border-radius: 2px;
            transition: all 0.35s var(--transition-smooth);
        }
        .glass-card__highlight:hover::after {
            background: rgba(244, 234, 197, 0.7);
            height: 5px;
            bottom: 2px;
        }

        /* ============ 作品集网格 ============ */
        .portfolio-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 32px;
        }
        .portfolio-item {
            background: rgba(1, 27, 110, 0.3);
            border: 1px solid rgba(164, 226, 198, 0.06);
            border-radius: 16px;
            overflow: hidden;
            transition: all 0.5s var(--transition-smooth);
            cursor: pointer;
            position: relative;
        }
        .portfolio-item:hover {
            background: rgba(1, 33, 130, 0.48);
            border-color: rgba(164, 226, 198, 0.28);
            box-shadow: 0 10px 44px rgba(0, 0, 0, 0.4);
            transform: translateY(-3px);
        }
        .portfolio-item__image {
            width: 100%;
            aspect-ratio: 4 / 3;
            background: linear-gradient(160deg, rgba(1, 28, 95, 0.85) 0%, rgba(1, 36, 125, 0.5) 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
            mask-image: linear-gradient(to bottom, black 78%, transparent 100%);
            -webkit-mask-image: linear-gradient(to bottom, black 78%, transparent 100%);
        }
        .portfolio-item__img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
            animation: imageSlowDrift 28s ease-in-out infinite both;
        }
        @keyframes imageSlowDrift {
            0%,
            100% {
                transform: scale(1) translateY(0);
            }
            25% {
                transform: scale(1.03) translateY(-2px);
            }
            50% {
                transform: scale(1.01) translateY(1px);
            }
            75% {
                transform: scale(1.04) translateY(-1px);
            }
        }
        .portfolio-item:hover .portfolio-item__img {
            animation-duration: 14s;
        }
        .portfolio-item__info {
            padding: 24px 26px;
            position: relative;
            z-index: 1;
            background: rgba(1, 27, 110, 0.25);
        }
        .portfolio-item__title {
            font-size: 0.92rem;
            font-weight: 700;
            color: var(--text-all);
            letter-spacing: 0.04em;
        }

        /* ============ 经历列表 ============ */
        .exp-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 0;
        }
        .exp-item {
            display: flex;
            align-items: baseline;
            gap: 28px;
            padding: 18px 0;
            border-bottom: 1px solid rgba(164, 226, 198, 0.05);
            transition: all 0.35s var(--transition-smooth);
            border-radius: 4px;
        }
        .exp-item:last-child {
            border-bottom: none;
        }
        .exp-item:hover {
            padding-left: 12px;
            border-bottom-color: rgba(164, 226, 198, 0.28);
            background: rgba(244, 234, 197, 0.025);
            border-radius: 6px;
        }
        .exp-item__year {
            font-size: 0.78rem;
            color: var(--text-all);
            letter-spacing: 0.08em;
            font-weight: 600;
            min-width: 70px;
            flex-shrink: 0;
        }
        .exp-item__content {
            font-size: 0.95rem;
            color: var(--text-all);
            letter-spacing: 0.025em;
            line-height: 1.65;
            font-weight: 400;
        }
        .exp-item__title {
            font-weight: 700;
            color: var(--text-all);
            display: block;
        }
        .exp-item__detail {
            color: var(--text-all);
            font-weight: 400;
            font-size: 0.82rem;
        }

        /* ============ giscus 评论区样式适配 ============ */
        .comments-wrap {
            width: 100%;
            min-height: 200px;
        }
        .comments-wrap .giscus {
            width: 100%;
        }
        .giscus-frame {
            border: none !important;
            background: transparent !important;
        }

        /* ============ 联系区域 ============ */
        .contact-row {
            display: flex;
            flex-wrap: wrap;
            gap: 18px;
            align-items: center;
            justify-content: center;
        }
        .contact-link,
        .contact-info {
            display: inline-flex;
            align-items: center;
            gap: 9px;
            text-decoration: none;
            color: var(--text-all);
            font-size: 0.92rem;
            font-weight: 500;
            letter-spacing: 0.05em;
            transition: all 0.35s var(--transition-smooth);
            padding: 12px 24px;
            border-radius: 28px;
            background: rgba(1, 38, 150, 0.2);
            border: 1px solid rgba(164, 226, 198, 0.1);
        }
        .contact-link:hover,
        .contact-info:hover {
            background: rgba(1, 38, 150, 0.38);
            border-color: rgba(164, 226, 198, 0.4);
            font-weight: 700;
            transform: translateY(-3px);
            box-shadow: 0 8px 28px rgba(0, 0, 0, 0.45);
        }
        .contact-link__dot,
        .contact-info__dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--accent-pale);
            flex-shrink: 0;
            transition: all 0.35s var(--transition-smooth);
        }
        .contact-link:hover .contact-link__dot,
        .contact-info:hover .contact-info__dot {
            box-shadow: 0 0 16px rgba(164, 226, 198, 0.65);
            transform: scale(1.3);
        }

        /* ============ 页脚 ============ */
        .footer {
            text-align: center;
            padding: 48px 0;
            color: var(--text-all);
            font-size: 0.78rem;
            font-weight: 400;
            letter-spacing: 0.08em;
            border-top: 1px solid rgba(164, 226, 198, 0.05);
            margin-top: 56px;
        }

        /* ============ Reveal 动画（使用 both，无 opacity:0） ============ */
        @keyframes revealBlurSlide {
            0% {
                filter: blur(18px);
                transform: translateY(42px);
            }
            100% {
                filter: blur(0);
                transform: translateY(0);
            }
        }
        .reveal-on-scroll {
            animation: none;
        }
        .reveal-on-scroll--visible {
            animation: revealBlurSlide 1.2s var(--transition-smooth) both;
        }

    <script>
        (function() {
            const cursor = document.getElementById('customCursor');
            let cursorX = window.innerWidth / 2;
            let cursorY = window.innerHeight / 2;
            let targetX = cursorX;
            let targetY = cursorY;
            let cursorVisible = false;
            let cursorTicking = false;

            const isTouchDevice = window.matchMedia('(hover: none) and (pointer: coarse)').matches;
            if (isTouchDevice) {
                cursor.style.display = 'none';
                document.documentElement.style.cursor = 'auto';
                document.body.style.cursor = 'auto';
            }

            function updateCursorPosition() {
                const dx = targetX - cursorX;
                const dy = targetY - cursorY;
                cursorX += dx * 0.2;
                cursorY += dy * 0.2;
                cursor.style.left = cursorX + 'px';
                cursor.style.top = cursorY + 'px';
                cursorTicking = false;
            }

            function requestCursorUpdate() {
                if (!cursorTicking) {
                    requestAnimationFrame(() => {
                        updateCursorPosition();
                    });
                    cursorTicking = true;
                }
            }

            document.addEventListener('mousemove', (e) => {
                targetX = e.clientX;
                targetY = e.clientY;
                if (!cursorVisible) {
                    cursorX = targetX;
                    cursorY = targetY;
                    cursor.style.left = cursorX + 'px';
                    cursor.style.top = cursorY + 'px';
                    cursor.style.opacity = '1';
                    cursorVisible = true;
                }
                requestCursorUpdate();
                const el = e.target;
                const shouldInvert =
                    el.tagName === 'A' ||
                    el.tagName === 'BUTTON' ||
                    el.closest('a') ||
                    el.closest('button') ||
                    el.closest('.nav__logo') ||
                    el.closest('.lang-switch') ||
                    el.closest('.portfolio-item') ||
                    el.closest('.contact-link') ||
                    el.closest('.contact-info') ||
                    el.closest('.glass-card__highlight') ||
                    el.closest('.hero__scroll-indicator');
                if (shouldInvert) {
                    cursor.classList.add('custom-cursor--inverted');
                    cursor.classList.add('custom-cursor--hover');
                } else {
                    cursor.classList.remove('custom-cursor--inverted');
                    cursor.classList.remove('custom-cursor--hover');
                }
            });

            document.addEventListener('mouseleave', () => {
                cursor.style.opacity = '0';
                cursorVisible = false;
                cursor.classList.remove('custom-cursor--inverted', 'custom-cursor--hover');
            });
            document.addEventListener('mouseenter', () => {
                cursor.style.opacity = '1';
                cursorVisible = true;
            });

            const loadingScreen = document.getElementById('loadingScreen');
            let loadingHidden = false;

            function hideLoadingScreen() {
                if (loadingHidden) return;
                loadingHidden = true;
                loadingScreen.classList.add('loading-screen--fade-out');
                loadingScreen.addEventListener('transitionend', function handler() {
                    loadingScreen.classList.add('loading-screen--hidden');
                    loadingScreen.removeEventListener('transitionend', handler);
                });
            }
            const minLoadTime = 2000;
            const startTime = Date.now();
            window.addEventListener('load', () => {
                const elapsed = Date.now() - startTime;
                const remaining = Math.max(0, minLoadTime - elapsed);
                setTimeout(hideLoadingScreen, remaining);
            });
            setTimeout(() => {
                if (!loadingHidden) hideLoadingScreen();
            }, 3500);

            const nav = document.getElementById('nav');
            const langSwitch = document.getElementById('langSwitch');
            const langOptions = langSwitch.querySelectorAll('.lang-option');
            const allTranslatable = document.querySelectorAll('[data-zh][data-en]');
            const revealElements = document.querySelectorAll('.reveal-on-scroll');
            let currentLang = 'zh';
            const translationCache = new Map();
            allTranslatable.forEach(el => {
                translationCache.set(el, {
                    zh: el.getAttribute('data-zh'),
                    en: el.getAttribute('data-en')
                });
            });

            function switchLanguage(lang) {
                if (currentLang === lang) return;
                currentLang = lang;
                langOptions.forEach(opt => {
                    const isActive = opt.getAttribute('data-lang') === lang;
                    opt.classList.toggle('lang-option--active', isActive);
                    opt.setAttribute('aria-pressed', isActive);
                });
                allTranslatable.forEach(el => {
                    const cached = translationCache.get(el);
                    if (cached && cached[lang]) {
                        el.innerHTML = cached[lang];
                    }
                });
                document.title = lang === 'zh' ? 'yrenk — 艺术家 / 设计师' : 'yrenk — Artist / Designer';
                document.documentElement.lang = lang === 'zh' ? 'zh-CN' : 'en';
                window.dispatchEvent(new CustomEvent('languageChanged', { detail: { lang } }));
            }
            langOptions.forEach(option => {
                option.addEventListener('click', () => {
                    switchLanguage(option.getAttribute('data-lang'));
                });
            });
            langSwitch.addEventListener('keydown', (e) => {
                if (e.key === 'Enter' || e.key === ' ') {
                    e.preventDefault();
                    switchLanguage(currentLang === 'zh' ? 'en' : 'zh');
                }
            });

            let scrollTicking = false;

            function updateNavScroll() {
                nav.classList.toggle('nav--scrolled', window.scrollY > 30);
                scrollTicking = false;
            }
            const revealedSet = new Set();
            function checkRevealElements() {
                const triggerPoint = window.innerHeight * 0.84;
                revealElements.forEach(el => {
                    if (el.getBoundingClientRect().top < triggerPoint && !revealedSet.has(el)) {
                        revealedSet.add(el);
                        el.classList.add('reveal-on-scroll--visible');
                    }
                });
            }
            window.addEventListener('scroll', () => {
                if (!scrollTicking) {
                    requestAnimationFrame(() => {
                        updateNavScroll();
                        checkRevealElements();
                    });
                    scrollTicking = true;
                }
            }, { passive: true });
            setTimeout(checkRevealElements, 450);

            let mx = 0,
                my = 0,
                tmx = 0,
                tmy = 0,
                mt = false;
            document.addEventListener('mousemove', (e) => {
                tmx = e.clientX;
                tmy = e.clientY;
                if (!mt) {
                    requestAnimationFrame(() => {
                        mx += (tmx - mx) * 0.06;
                        my += (tmy - my) * 0.06;
                        const cx = window.innerWidth / 2;
                        const cy = window.innerHeight / 2;
                        const ox = (mx - cx) / cx;
                        const oy = (my - cy) / cy;
                        const orbs = document.querySelectorAll('.bg-orb');
                        if (orbs[0]) orbs[0].style.transform = `translate(${ox*14}px, ${oy*14}px)`;
                        if (orbs[1]) orbs[1].style.transform = `translate(${-ox*18}px, ${-oy*18}px)`;
                        if (orbs[2]) orbs[2].style.transform = `translate(${ox*9}px, ${-oy*11}px)`;
                        if (orbs[3]) orbs[3].style.transform = `translate(${-ox*16}px, ${oy*9}px)`;
                        mt = false;
                    });
                    mt = true;
                }
            }, { passive: true });

            document.addEventListener('keydown', (e) => {
                if ((e.ctrlKey || e.metaKey) && e.key === 'l') {
                    e.preventDefault();
                    switchLanguage(currentLang === 'zh' ? 'en' : 'zh');
                }
            });

            console.log('%c yrenk %c personal site ',
                'font-size:1.5em;font-weight:700;color:#F4EAC5;letter-spacing:0.06em;',
                'font-size:0.9em;color:#F4EAC5;');
            console.log('%cSwiss Spa · giscus 评论已集成 %c| %cCtrl+L',
                'color:#F4EAC5;', '', 'color:#F4EAC5;font-size:0.85em;');

            checkRevealElements();
            window.switchLanguage = switchLanguage;
            window.getCurrentLang = () => currentLang;
        })();
    </script>
