<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>yrenk — artist / designer</title>
    <style>
        :root {
            --primary-deeper: #00145c;
            --primary-mid-dark: #012696;
            --accent-pale: #A4E2C6;
            --text-all: #F4EAC5;
            --blur-strong: 56px;
            --spring: cubic-bezier(0.34, 1.56, 0.64, 1);
            --spring-soft: cubic-bezier(0.25, 1.2, 0.5, 1);
        }
        * { margin:0; padding:0; box-sizing:border-box; }
        html { scroll-behavior:smooth; scrollbar-width:thin; scrollbar-color:var(--primary-lighter) transparent; cursor:none; }
        ::-webkit-scrollbar { width:4px; }
        ::-webkit-scrollbar-track { background:transparent; }
        ::-webkit-scrollbar-thumb { background:var(--primary-mid-dark); border-radius:2px; }
        body {
            font-family: 'Inter', 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', system-ui, sans-serif;
            background-color: var(--primary-deeper);
            color: var(--text-all);
            line-height: 1.75;
            letter-spacing: 0.01em;
            -webkit-font-smoothing: antialiased;
            overflow-x: hidden;
            min-height: 100vh;
            position: relative;
            cursor: none;
            font-weight: 300;
        }

        .custom-cursor {
            position:fixed; top:0; left:0; width:10px; height:10px; border-radius:50%;
            background:var(--accent-pale); pointer-events:none; z-index:99999;
            transform: translate(-50%, -50%);
            transition: width 0.28s, height 0.28s, background 0.32s;
        }
        .custom-cursor--inverted { background:var(--primary-mid-dark); box-shadow:0 0 20px 3px rgba(1,38,150,0.5); }
        .custom-cursor--hover { width:22px; height:22px; box-shadow:0 0 24px 6px rgba(164,226,198,0.55); }
        @media (hover:none) and (pointer:coarse) { .custom-cursor { display:none; } html,body { cursor:auto; } }

        .loading-screen {
            position:fixed; inset:0; z-index:9998; background:var(--primary-deeper);
            display:flex; align-items:flex-start; justify-content:center;
            transition: opacity 0.55s; opacity:1; pointer-events:all;
        }
        .loading-screen--fade-out { opacity:0; pointer-events:none; }
        .loading-screen--hidden { display:none; }
        .loading-logo { position:absolute; top:40px; left:40px; font-size:1.35rem; font-weight:700; letter-spacing:0.05em; color:var(--text-all); text-decoration:none; z-index:1; }
        .loading-indicator { position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); width:200px; height:1.5px; background:rgba(244,234,197,0.14); border-radius:1px; overflow:hidden; }
        .loading-bar { height:100%; width:0%; background:var(--accent-pale); border-radius:1px; box-shadow:0 0 12px rgba(164,226,198,0.45); animation:loadingProgress 2s both; }
        @keyframes loadingProgress { 0% { width:0%; } 100% { width:100%; } }

        .bg-orbs { position:fixed; top:0; left:0; width:100%; height:100%; pointer-events:none; z-index:0; overflow:hidden; }
        .bg-orb { position:absolute; border-radius:50%; filter:blur(var(--blur-strong)); opacity:0.2; will-change:transform; animation-iteration-count:infinite; }
        .bg-orb--1 { width:58vmax; height:58vmax; background:radial-gradient(circle,rgba(1,38,150,0.45) 0%,rgba(0,20,80,0.18) 50%,transparent 70%); top:-22%; left:-16%; animation:orbFloat1 20s ease-in-out infinite; }
        .bg-orb--2 { width:50vmax; height:50vmax; background:radial-gradient(circle,rgba(1,38,150,0.4) 0%,rgba(0,15,60,0.14) 50%,transparent 70%); bottom:-28%; right:-14%; animation:orbFloat2 24s ease-in-out infinite; animation-delay:-6s; }
        .bg-orb--3 { width:40vmax; height:40vmax; background:radial-gradient(circle,rgba(244,234,197,0.14) 0%,rgba(200,180,140,0.06) 50%,transparent 70%); top:48%; left:38%; animation:orbFloat3 22s ease-in-out infinite; animation-delay:-12s; }
        @keyframes orbFloat1 { 0%,100% { transform:translate(0,0) scale(1); } 20% { transform:translate(9vw,6vh) scale(1.14); } 40% { transform:translate(4vw,13vh) scale(0.89); } 60% { transform:translate(-6vw,8vh) scale(1.07); } 80% { transform:translate(3vw,-4vh) scale(0.94); } }
        @keyframes orbFloat2 { 0%,100% { transform:translate(0,0) scale(1); } 25% { transform:translate(-7vw,-9vh) scale(1.12); } 50% { transform:translate(-3vw,-4vh) scale(0.87); } 75% { transform:translate(6vw,-7vh) scale(1.05); } }
        @keyframes orbFloat3 { 0%,100% { transform:translate(0,0) scale(1); } 30% { transform:translate(6vw,-5vh) scale(1.1); } 60% { transform:translate(-4vw,7vh) scale(0.91); } 85% { transform:translate(2vw,-3vh) scale(1.04); } }
        .bg-texture { position:fixed; inset:0; pointer-events:none; z-index:0; opacity:0.015; background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='1'/%3E%3C/svg%3E"); background-size:180px 180px; }

        /* 导航 */
        .nav {
            position:fixed; top:0; left:0; right:0; z-index:100; padding:16px 48px;
            display:flex; align-items:center; justify-content:space-between;
            background:rgba(0,18,70,0.5); backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px);
            border-bottom:1px solid rgba(164,226,198,0.06); transition:all 0.45s var(--spring-soft);
        }
        .nav--scrolled { background:rgba(0,8,36,0.7); backdrop-filter:blur(16px); -webkit-backdrop-filter:blur(16px); border-bottom-color:rgba(164,226,198,0.2); padding:12px 48px; }
        .nav__logo { font-size:1.2rem; font-weight:700; letter-spacing:0.06em; color:var(--text-all); text-decoration:none; transition:transform 0.3s var(--spring); }
        .nav__logo:active { transform:scale(0.95); }
        .nav__links { display:flex; align-items:center; gap:28px; list-style:none; }
        .nav__link { text-decoration:none; color:var(--text-all); font-size:0.85rem; font-weight:400; letter-spacing:0.05em; transition:all 0.3s var(--spring-soft); padding:5px 0; background:none; border:none; font-family:inherit; cursor:pointer; }
        .nav__link:hover { font-weight:600; }
        .lang-switch { display:flex; align-items:center; gap:3px; background:rgba(1,38,150,0.22); border:1px solid rgba(164,226,198,0.16); border-radius:8px; padding:3px; cursor:pointer; }
        .lang-switch:active { transform:scale(0.96); }
        .lang-option { padding:5px 14px; border-radius:6px; font-size:0.76rem; letter-spacing:0.05em; cursor:pointer; border:none; background:transparent; color:var(--text-all); font-family:inherit; font-weight:400; }
        .lang-option--active { background:var(--accent-pale); color:var(--primary-mid-dark); font-weight:700; }

        /* Hero = 全屏球体 */
        .hero {
            width:100%; height:100vh; position:relative; overflow:hidden;
            display:flex; align-items:center; justify-content:center;
        }
        .hero-sphere {
            width:100%; height:100%; position:absolute; top:0; left:0;
            perspective:1200px; overflow:visible;
        }
        .hero-sphere-canvas {
            position:absolute; top:50%; left:50%; width:0; height:0;
            transform-style:preserve-3d; pointer-events:none;
        }
        .hero-sphere-img {
            position:absolute; width:180px; height:auto; border-radius:10px;
            box-shadow:0 20px 60px rgba(0,0,0,0.5); transform-origin:center center;
            transition:filter 0.3s; will-change:transform,z-index; pointer-events:auto; cursor:pointer;
        }
        .hero-sphere-img:hover { filter:brightness(1.2); }
        /* 叠加文字 */
        .hero-overlay {
            position:absolute; bottom:60px; left:60px; z-index:10; pointer-events:none;
            animation:fadeInUp 1.5s 0.5s var(--spring-soft) both;
        }
        @keyframes fadeInUp { 0% { filter:blur(10px); transform:translateY(20px); } 100% { filter:blur(0); transform:translateY(0); } }
        .hero-overlay p { font-size:clamp(1rem,2vw,1.3rem); font-weight:300; letter-spacing:0.06em; color:var(--text-all); line-height:1.6; }
        .hero-overlay p strong { font-weight:500; }
        .hero-scroll {
            position:absolute; bottom:36px; left:60px; z-index:10;
            display:flex; align-items:center; gap:12px; cursor:pointer;
            background:none; border:none; color:var(--text-all); font-family:inherit;
            font-size:0.68rem; letter-spacing:0.12em; font-weight:400;
            animation:fadeInUp 1.5s 0.8s var(--spring-soft) both;
        }
        .hero-scroll:hover { gap:18px; }
        .hero-scroll-line { width:28px; height:1px; background:var(--text-all); transition:width 0.4s; }
        .hero-scroll:hover .hero-scroll-line { width:44px; }

        .section { padding:100px 0; position:relative; }
        .section__label { font-size:0.7rem; text-transform:uppercase; letter-spacing:0.18em; color:var(--text-all); margin-bottom:36px; font-weight:500; }
        .section-divider { width:100%; height:1px; background:rgba(244,234,197,0.08); margin:40px 0; }
        .text-block { max-width:800px; margin:0 auto; }
        .text-block p { font-size:1.08rem; line-height:2; color:var(--text-all); font-weight:300; letter-spacing:0.025em; margin-bottom:24px; }
        .main-container { position:relative; z-index:1; max-width:1080px; margin:0 auto; padding:0 48px; }

        .comments-toggle {
            display:inline-flex; align-items:center; gap:10px; cursor:pointer;
            background:rgba(1,38,150,0.18); border:1px solid rgba(164,226,198,0.12);
            border-radius:8px; padding:12px 24px; color:var(--text-all); font-family:inherit;
            font-size:0.9rem; font-weight:500; letter-spacing:0.05em; transition:all 0.4s var(--spring);
        }
        .comments-toggle:active { transform:scale(0.94); }
        .comments-toggle:hover { background:rgba(1,46,176,0.3); border-color:rgba(164,226,198,0.3); gap:14px; }
        .comments-toggle__icon { width:18px; height:18px; transition:transform 0.45s var(--spring); display:flex; align-items:center; justify-content:center; }
        .comments-toggle__icon svg { width:100%; height:100%; stroke:var(--text-all); fill:none; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; }
        .comments-toggle--expanded .comments-toggle__icon { transform:rotate(180deg); }
        .comments-toggle__label { white-space:nowrap; }
        .comments-toggle__count { display:inline-flex; align-items:center; justify-content:center; min-width:22px; height:22px; border-radius:6px; background:var(--accent-pale); color:var(--primary-mid-dark); font-size:0.72rem; font-weight:700; padding:0 7px; transition:all 0.35s var(--spring); opacity:0; transform:scale(0.8); }
        .comments-toggle__count--visible { opacity:1; transform:scale(1); }
        .comments-collapse-wrapper { display:grid; grid-template-rows:1fr; transition:grid-template-rows 0.55s var(--spring-soft); margin-top:24px; }
        .comments-collapse-wrapper--collapsed { grid-template-rows:0fr; }
        .comments-collapse-inner { overflow:hidden; }
        .comments-content { border-radius:8px; background:rgba(1,27,110,0.15); border:1px solid rgba(164,226,198,0.04); padding:8px; min-height:60px; }

        .contact-row { display:flex; flex-wrap:wrap; gap:18px; align-items:center; justify-content:center; }
        .contact-link,.contact-info { display:inline-flex; align-items:center; gap:9px; text-decoration:none; color:var(--text-all); font-size:0.92rem; font-weight:500; letter-spacing:0.05em; transition:all 0.35s var(--spring); padding:12px 24px; border-radius:6px; background:rgba(1,38,150,0.15); border:1px solid rgba(164,226,198,0.08); }
        .contact-link:active,.contact-info:active { transform:scale(0.94); }
        .contact-link:hover,.contact-info:hover { background:rgba(1,38,150,0.3); border-color:rgba(164,226,198,0.3); font-weight:700; transform:translateY(-2px); }
        .contact-link__dot,.contact-info__dot { width:6px; height:6px; border-radius:50%; background:var(--accent-pale); }
        .footer { text-align:center; padding:60px 0; color:var(--text-all); font-size:0.78rem; font-weight:300; letter-spacing:0.08em; border-top:1px solid rgba(164,226,198,0.06); }

        @keyframes revealBlurSlide { 0% { filter:blur(18px); transform:translateY(42px); } 100% { filter:blur(0); transform:translateY(0); } }
        .reveal-on-scroll { animation:none; }
        .reveal-on-scroll--visible { animation:revealBlurSlide 1.2s var(--spring-soft) both; }

        @media (max-width:860px) {
            .main-container { padding:0 32px; }
            .nav { padding:14px 32px; }
            .nav__links { gap:16px; }
            .hero-overlay { bottom:40px; left:32px; }
            .hero-scroll { bottom:24px; left:32px; }
            .hero-sphere-img { width:140px; }
            .section { padding:70px 0; }
        }
        @media (max-width:600px) {
            .main-container { padding:0 20px; }
            .nav { padding:12px 20px; }
            .nav__links { gap:8px; }
            .nav__link { font-size:0.72rem; }
            .hero-overlay { bottom:32px; left:20px; }
            .hero-overlay p { font-size:0.9rem; }
            .hero-scroll { bottom:16px; left:20px; }
            .hero-sphere-img { width:100px; }
            .section { padding:50px 0; }
            .text-block p { font-size:0.95rem; }
            .contact-row { flex-direction:column; gap:12px; }
            .contact-link,.contact-info { font-size:0.84rem; padding:10px 20px; text-align:center; justify-content:center; }
            .loading-logo { top:24px; left:20px; font-size:1.1rem; }
            .lang-option { padding:4px 10px; font-size:0.7rem; }
        }
    </style>
</head>

    <script>
        (function() {
            const cursor = document.getElementById('customCursor');
            let cx=window.innerWidth/2,cy=window.innerHeight/2,tx=cx,ty=cy,cv=false,ct=false;
            const td=window.matchMedia('(hover:none) and (pointer:coarse)').matches;
            if(td){cursor.style.display='none';document.documentElement.style.cursor='auto';document.body.style.cursor='auto';}
            function uc(){const dx=tx-cx,dy=ty-cy;cx+=dx*0.2;cy+=dy*0.2;cursor.style.left=cx+'px';cursor.style.top=cy+'px';ct=false;}
            function rc(){if(!ct){requestAnimationFrame(uc);ct=true;}}
            document.addEventListener('mousemove',e=>{
                tx=e.clientX;ty=e.clientY;if(!cv){cx=tx;cy=ty;cursor.style.left=cx+'px';cursor.style.top=cy+'px';cursor.style.opacity='1';cv=true;}rc();
                const el=e.target,inv=el.closest('a')||el.closest('button')||el.closest('.hero-sphere-img')||el.closest('.nav__link');
                if(inv){cursor.classList.add('custom-cursor--inverted','custom-cursor--hover');}else{cursor.classList.remove('custom-cursor--inverted','custom-cursor--hover');}
            });
            document.addEventListener('mouseleave',()=>{cursor.style.opacity='0';cv=false;cursor.classList.remove('custom-cursor--inverted','custom-cursor--hover');});
            document.addEventListener('mouseenter',()=>{cursor.style.opacity='1';cv=true;});

            const ls=document.getElementById('loadingScreen');let lh=false;
            function hl(){if(lh)return;lh=true;ls.classList.add('loading-screen--fade-out');ls.addEventListener('transitionend',function h(){ls.classList.add('loading-screen--hidden');ls.removeEventListener('transitionend',h);});}
            setTimeout(()=>{if(!lh)hl();},2200);
            window.addEventListener('load',()=>{setTimeout(()=>{if(!lh)hl();},200);});

            const nav=document.getElementById('nav');let st=false;
            function un(){nav.classList.toggle('nav--scrolled',window.scrollY>30);st=false;}
            window.addEventListener('scroll',()=>{if(!st){requestAnimationFrame(()=>{un();cr();});st=true;}},{passive:true});

            const re=document.querySelectorAll('.reveal-on-scroll');const rs=new Set();
            function cr(){const tp=window.innerHeight*0.84;re.forEach(el=>{if(el.getBoundingClientRect().top<tp&&!rs.has(el)){rs.add(el);el.classList.add('reveal-on-scroll--visible');}});}
            setTimeout(cr,450);

            // 全屏球体
            const paths=['images/a.webp','images/b.webp','images/c.webp','images/d.webp','images/e.webp'];
            const canvas=document.getElementById('heroSphereCanvas');
            const container=document.getElementById('heroSphere');
            const N=paths.length;
            const radius=Math.min(window.innerWidth,window.innerHeight)*0.35;
            let imgs=[],bp=[];
            const gr=(1+Math.sqrt(5))/2;
            for(let i=0;i<N;i++){bp.push({lat:Math.acos(1-2*(i+0.5)/N),lon:2*Math.PI*i/gr});}
            paths.forEach((s,i)=>{
                const img=document.createElement('img');img.src=s+'?v=202506';img.className='hero-sphere-img';img.alt=`作品${i+1}`;img.loading='lazy';
                canvas.appendChild(img);imgs.push(img);
                img.addEventListener('click',e=>{e.stopPropagation();window.open(s,'_blank');});
            });
            let ry=0,rx=0,tr=0,txr=0,ma=false,af;
            function us(){
                ry+=(tr-ry)*0.08;rx+=(txr-rx)*0.08;
                const d=[];
                for(let i=0;i<N;i++){
                    const{lat,lon}=bp[i];
                    let x=radius*Math.sin(lat)*Math.cos(lon),y=radius*Math.cos(lat),z=radius*Math.sin(lat)*Math.sin(lon);
                    const cy=Math.cos(ry),sy=Math.sin(ry);let x1=x*cy-z*sy,z1=x*sy+z*cy;x=x1;z=z1;
                    const cx=Math.cos(rx),sx=Math.sin(rx);let y1=y*cx-z*sx,z2=y*sx+z*cx;y=y1;z=z2;
                    d.push({e:imgs[i],x,y,z});
                }
                d.sort((a,b)=>a.z-b.z);
                d.forEach((o,i)=>{
                    const s=1200/(1200+o.z);
                    o.e.style.transform=`translate(-50%,-50%) translate3d(${o.x*s}px,${o.y*s}px,0) scale(${s})`;
                    o.e.style.zIndex=i;o.e.style.opacity=Math.max(0.25,Math.min(1,(o.z+radius)/(2*radius)));
                });
                if(!ma)tr+=0.002;
                af=requestAnimationFrame(us);
            }
            container.addEventListener('mousemove',e=>{
                const r=container.getBoundingClientRect();
                tr=(e.clientX-r.left-r.width/2)/r.width*Math.PI*2;
                txr=-(e.clientY-r.top-r.height/2)/r.height*Math.PI*1.5;
                ma=true;clearTimeout(window.mt);window.mt=setTimeout(()=>{ma=false;},2000);
            });
            container.addEventListener('touchmove',e=>{
                e.preventDefault();
                const r=container.getBoundingClientRect(),t=e.touches[0];
                tr=(t.clientX-r.left-r.width/2)/r.width*Math.PI*2;
                txr=-(t.clientY-r.top-r.height/2)/r.height*Math.PI*1.5;
                ma=true;clearTimeout(window.mt);window.mt=setTimeout(()=>{ma=false;},2000);
            },{passive:false});
            container.addEventListener('mouseleave',()=>{ma=false;});
            window.addEventListener('resize',()=>{/* 球体自适应 */});
            us();

            const lsw=document.getElementById('langSwitch'),lo=lsw.querySelectorAll('.lang-option'),at=document.querySelectorAll('[data-zh][data-en]');
            let cl='zh';const tc=new Map();at.forEach(el=>{tc.set(el,{zh:el.getAttribute('data-zh'),en:el.getAttribute('data-en')});});
            function sl(l){if(cl===l)return;cl=l;lo.forEach(o=>{o.classList.toggle('lang-option--active',o.getAttribute('data-lang')===l);});at.forEach(el=>{const c=tc.get(el);if(c&&c[l])el.innerHTML=c[l];});document.title=l==='zh'?'yrenk — 艺术家 / 设计师':'yrenk — Artist / Designer';document.documentElement.lang=l==='zh'?'zh-CN':'en';}
            lo.forEach(o=>{o.addEventListener('click',()=>{sl(o.getAttribute('data-lang'));});});

            const ctb=document.getElementById('commentsToggle'),ccw=document.getElementById('commentsCollapseWrapper'),cc=document.getElementById('commentsCount');
            let ie=true,tc2=0;
            function uc2(){if(ie){ctb.classList.add('comments-toggle--expanded');ccw.classList.remove('comments-collapse-wrapper--collapsed');ctb.querySelector('.comments-toggle__label').textContent=cl==='zh'?'收起讨论':'Collapse';}else{ctb.classList.remove('comments-toggle--expanded');ccw.classList.add('comments-collapse-wrapper--collapsed');ctb.querySelector('.comments-toggle__label').textContent=cl==='zh'?'展开讨论':'Discussion';}if(tc2>0){cc.textContent=tc2;cc.classList.add('comments-toggle__count--visible');}else{cc.classList.remove('comments-toggle__count--visible');}}
            ctb.addEventListener('click',()=>{ie=!ie;uc2();});
            window.addEventListener('message',e=>{if(e.origin==='https://giscus.app'&&e.data&&e.data.giscus){const d=e.data.giscus;if(d.discussion&&typeof d.discussion.totalCommentCount==='number'){tc2=d.discussion.totalCommentCount+(d.discussion.totalReplyCount||0);uc2();}}});
            uc2();

            console.log('%c yrenk %c Fullscreen Sphere ','font-size:1.5em;font-weight:700;color:#F4EAC5;','font-size:0.9em;color:#F4EAC5;');
            window.switchLanguage=sl;
        })();
    </script>
